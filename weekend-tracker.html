<html lang="en">

<style>
:root{--bg:#090c10;--panel:#11161c;--panel2:#171e26;--panel3:#1d2630;--line:#2a3542;--text:#f6f8fb;--muted:#93a2b2;--yellow:#ffc928;--orange:#ff8a1f;--green:#37d27e;--red:#ff6872;--blue:#61adff;--slot:84px;--league:292px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 50% -10%,rgba(255,201,40,.09),transparent 32%),var(--bg)}button,input,select{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:60;background:rgba(9,12,16,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.toprow{display:flex;gap:10px;align-items:center;padding:10px 14px}.brand{display:flex;gap:10px;align-items:center;min-width:220px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--yellow),var(--orange));color:#111;font-size:21px}.brand small{display:block;color:var(--yellow);font-size:9px;font-weight:950;letter-spacing:.12em}.brand b{font-size:17px}.controls{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn,.field{min-height:39px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:8px 10px}.btn{cursor:pointer;font-weight:850}.btn:hover{border-color:#526274}.btn.primary{border:0;background:linear-gradient(135deg,var(--yellow),var(--orange));color:#111}.btn.danger{color:#ffadb3;border-color:rgba(255,104,114,.35)}.btn.small{min-height:29px;padding:5px 8px;font-size:10px}.searchrow{padding:0 14px 10px;display:flex;gap:8px;align-items:center}.searchwrap{position:relative;flex:1;max-width:760px}.searchwrap input{width:100%}.searchmenu{display:none;position:absolute;top:45px;left:0;right:0;z-index:90;background:#151c24;border:1px solid var(--line);border-radius:12px;box-shadow:0 22px 60px rgba(0,0,0,.45);max-height:390px;overflow:auto}.searchmenu.open{display:block}.searchitem{display:flex;gap:9px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}.searchitem:last-child{border-bottom:0}.searchitem:hover{background:#202a35}.avatar{width:36px;height:36px;border-radius:10px;background:#222d38;color:var(--yellow);display:grid;place-items:center;font-size:11px;font-weight:950;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.searchitem b,.searchitem small{display:block}.searchitem small{color:var(--muted);font-size:10px}.statuspill{font-size:10px;color:var(--muted);white-space:nowrap}.main{padding:14px}.emptyStart{max-width:780px;margin:50px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}.emptyStart h1{margin:0 0 9px;font-size:30px}.emptyStart p{color:var(--muted);line-height:1.5}.matrixShell{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}.matrixToolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.matrixToolbar .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.matrixScroll{overflow:auto;max-height:calc(100vh - 172px)}table.matrix{border-collapse:separate;border-spacing:0;min-width:100%;width:max-content}.matrix th,.matrix td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}.matrix thead th{position:sticky;top:0;z-index:30;background:#121820}.matrix .slotHead{left:0;z-index:45;min-width:var(--slot);width:var(--slot);position:sticky}.matrix .slotCell{position:sticky;left:0;z-index:20;background:#111820;min-width:var(--slot);width:var(--slot);padding:10px 7px;text-align:center}.slotTag{display:inline-flex;min-width:48px;justify-content:center;padding:5px 6px;border-radius:8px;background:#202a34;color:#d7dfe7;font-size:10px;font-weight:950}.slotTag.bench{color:#9dacbb;background:#171e26}.leagueHead{width:var(--league);min-width:var(--league);padding:10px 11px;text-align:left}.leagueHeadTop{display:flex;gap:8px;align-items:flex-start}.leagueHead h3{margin:0;font-size:15px}.leagueHead small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.leaguePts{margin-left:auto;text-align:right}.leaguePts b{display:block;color:var(--yellow);font-size:19px}.leaguePts span{color:var(--muted);font-size:8px;text-transform:uppercase}.leagueActions{display:flex;gap:5px;margin-top:8px}.playerCell{width:var(--league);min-width:var(--league);height:118px;padding:7px;background:#0f141a;position:relative}.playerCell.empty{cursor:pointer}.playerCell.empty:hover{background:#151c24}.emptyCell{height:100%;display:grid;place-items:center;color:#627181;font-size:10px;font-weight:800}.pcard{height:100%;display:flex;flex-direction:column;gap:6px}.phead{display:flex;gap:8px;align-items:center}.pname{min-width:0;flex:1}.pname b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.pname small{display:block;color:var(--muted);font-size:9px}.remove{border:0;background:transparent;color:#647382;cursor:pointer;font-size:16px;padding:3px}.remove:hover{color:var(--red)}.gameLine{display:flex;gap:6px;align-items:center}.gameState{font-size:9px;font-weight:900;padding:3px 6px;border-radius:999px;background:#252e38;color:#cbd4dc}.gameState.live{background:rgba(55,210,126,.14);color:#85ebb0}.gameState.final{background:#202730;color:#8e9aa7}.gameState.pre{background:rgba(97,173,255,.11);color:#9dd0ff}.progress{height:5px;border-radius:99px;background:#232d38;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:99px}.statLine{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}.stat{font-size:8px;padding:3px 5px;border-radius:6px;background:#1d2630;color:#c7d0d9;font-weight:800}.fantasyLine{display:flex;align-items:end;margin-top:auto}.fantasyLine strong{font-size:22px;color:var(--green);line-height:1}.fantasyLine span{font-size:8px;color:var(--muted);text-transform:uppercase;margin-left:5px;margin-bottom:2px}.benchRow .playerCell{background:#0c1116}.modal{display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{width:min(620px,100%);max-height:92vh;overflow:auto;background:#11171e;border:1px solid #34404d;border-radius:17px}.modalhead{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.modalhead h2{margin:0;font-size:16px}.modalhead .btn{margin-left:auto}.modalbody{padding:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid label{font-size:10px;color:var(--muted);font-weight:850}.formgrid .field{width:100%;margin-top:4px}.assignHero{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:11px}.assignHero b,.assignHero small{display:block}.assignHero small{color:var(--muted);font-size:10px}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scoregrid label{font-size:9px;color:var(--muted);font-weight:850}.scoregrid input{width:100%;margin-top:4px}.toast{position:fixed;right:14px;bottom:14px;z-index:200;background:#1b242d;border:1px solid #3a4856;border-radius:11px;padding:10px 12px;font-size:11px;font-weight:850;opacity:0;transform:translateY(20px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:760px){:root{--league:260px}.toprow{padding:8px 10px}.brand small{font-size:7px}.brand b{font-size:14px}.logo{width:35px;height:35px}.controls .desktop{display:none}.searchrow{padding:0 10px 8px}.main{padding:8px}.matrixToolbar{padding:8px}.matrixScroll{max-height:calc(100vh - 146px)}.formgrid,.scoregrid{grid-template-columns:1fr}.leagueHead{padding:8px}.playerCell{height:112px;padding:6px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand"><div class="logo">🏈</div><div><small>FANTASY WEEKEND</small><b>League Matrix</b></div></div>
      <div class="controls">
        <select id="season" class="field desktop" aria-label="Season"></select>
        <select id="week" class="field" aria-label="Week"></select>
        <button id="refresh" class="btn primary">↻ <span class="desktop">Refresh</span></button>
        <button id="addLeague" class="btn">+ League</button>
      </div>
    </div>
    <div class="searchrow">
      <div class="searchwrap"><input id="playerSearch" class="field" autocomplete="off" placeholder="Type a player name, e.g. Lamar Jackson"><div id="searchMenu" class="searchmenu"></div></div>
      <span id="playerStatus" class="statuspill">Players: loading…</span>
    </div>
  </header>
  <main class="main">
    <div id="emptyStart" class="emptyStart" style="display:none"><h1>Start with your leagues.</h1><p>Create each fantasy team, then type player names above and assign them into the roster matrix. No bulk imports, no draft parsing.</p><button class="btn primary" id="emptyAddLeague">+ Create First League</button></div>
    <section id="matrixShell" class="matrixShell" style="display:none">
      <div class="matrixToolbar"><b>Weekend Matrix</b><span id="dataStatus" class="statuspill">Stats not loaded</span><div class="right"><label class="statuspill">Bench rows <select id="benchCount" class="field"></select></label><button id="reloadPlayers" class="btn small">Reload Players</button></div></div>
      <div class="matrixScroll"><table class="matrix" id="matrix"></table></div>
    </section>
  </main>
</div>

<div id="leagueModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="leagueModalTitle">Add League</h2><button class="btn small" data-close="leagueModal">×</button></div><div class="modalbody"><div class="formgrid"><label>League / Team Name<input id="leagueName" class="field" placeholder="Work League"></label><label>Platform<select id="leaguePlatform" class="field"><option>Yahoo</option><option>ESPN</option><option>Sleeper</option><option>NFL</option><option>Other</option></select></label><label>Scoring Preset<select id="leaguePreset" class="field"><option value="half">Half PPR</option><option value="ppr">Full PPR</option><option value="standard">Standard</option></select></label><label>Note<input id="leagueNote" class="field" placeholder="Optional"></label></div><div style="display:flex;gap:8px;margin-top:12px"><button id="saveLeague" class="btn primary">Save League</button><button id="deleteLeague" class="btn danger" style="display:none">Delete</button></div></div></div></div>

<div id="assignModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>Assign Player</h2><button class="btn small" data-close="assignModal">×</button></div><div class="modalbody"><div id="assignHero" class="assignHero"></div><div class="formgrid"><label>League<select id="assignLeague" class="field"></select></label><label>Roster Slot<select id="assignSlot" class="field"></select></label></div><div style="display:flex;gap:8px;margin-top:12px"><button id="saveAssignment" class="btn primary">Assign Player</button></div></div></div></div>

<div id="scoringModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="scoringTitle">Scoring</h2><button class="btn small" data-close="scoringModal">×</button></div><div class="modalbody"><div class="scoregrid" id="scoreGrid"></div><div style="display:flex;gap:8px;margin-top:12px"><button id="saveScoring" class="btn primary">Save Scoring</button></div></div></div></div>
<div id="toast" class="toast"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],num=v=>Number.isFinite(Number(v))?Number(v):0,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>(Math.round(num(v)*100)/100).toFixed(2),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const STORE='fantasyWeekendMatrix.v1',PLAYER_CACHE='fantasyWeekendMatrix.players.v1',WEEK_CACHE='fantasyWeekendMatrix.week.v1';
const TEAM_NAMES={ARI:'Arizona Cardinals',ATL:'Atlanta Falcons',BAL:'Baltimore Ravens',BUF:'Buffalo Bills',CAR:'Carolina Panthers',CHI:'Chicago Bears',CIN:'Cincinnati Bengals',CLE:'Cleveland Browns',DAL:'Dallas Cowboys',DEN:'Denver Broncos',DET:'Detroit Lions',GB:'Green Bay Packers',HOU:'Houston Texans',IND:'Indianapolis Colts',JAX:'Jacksonville Jaguars',KC:'Kansas City Chiefs',LV:'Las Vegas Raiders',LAC:'Los Angeles Chargers',LAR:'Los Angeles Rams',MIA:'Miami Dolphins',MIN:'Minnesota Vikings',NE:'New England Patriots',NO:'New Orleans Saints',NYG:'New York Giants',NYJ:'New York Jets',PHI:'Philadelphia Eagles',PIT:'Pittsburgh Steelers',SEA:'Seattle Seahawks',SF:'San Francisco 49ers',TB:'Tampa Bay Buccaneers',TEN:'Tennessee Titans',WAS:'Washington Commanders'},TEAM_ALIAS={JAC:'JAX',WSH:'WAS',OAK:'LV',SD:'LAC',STL:'LAR'};
const STARTERS=[['QB','QB'],['RB1','RB'],['RB2','RB'],['WR1','WR'],['WR2','WR'],['TE','TE'],['DEF','DEF'],['K','K']];
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/d\s*\/\s*st/g,' dst ').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,' ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' '),canon=t=>TEAM_ALIAS[t]||t||'';
const defaultScore=(preset='half')=>({rec:preset==='ppr'?1:preset==='standard'?0:.5,passYd:.04,passTD:4,passInt:-2,rushYd:.1,rushTD:6,recYd:.1,recTD:6,fumLost:-2,xpm:1,fg0:3,fg40:4,fg50:5,defSack:1,defInt:2,defFR:2,defTD:6,pa0:10,pa1_6:7,pa7_13:4,pa14_20:1,pa21_27:0,pa28_34:-1,pa35:-4});
const initialState=()=>({season:new Date().getFullYear(),week:1,benchCount:6,leagues:[]});
let state=loadState(),players=[],playerMap=new Map(),searchIndex=[],statsByPlayer=new Map(),statsByTeam=new Map(),gamesByTeam=new Map(),editingLeague=null,pendingPlayer=null,presetTarget=null,refreshTimer=null;
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&Array.isArray(x.leagues)){x.leagues.forEach(l=>{l.roster=l.roster||{};l.scoring={...defaultScore('half'),...(l.scoring||{})}});return {...initialState(),...x}}}catch(e){}return initialState()}
function saveState(){localStorage.setItem(STORE,JSON.stringify(state))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}
function openModal(id){$('#'+id).classList.add('open')}function closeModal(id){$('#'+id).classList.remove('open')}
function slotRows(){const rows=STARTERS.map(([key,pos])=>({key,label:key,pos,bench:false}));for(let i=1;i<=state.benchCount;i++)rows.push({key:'BN'+i,label:'BN'+i,pos:'BN',bench:true});return rows}
function compatible(p,slot){if(slot.startsWith('BN'))return true;if(p.pos==='DEF')return slot==='DEF';if(slot==='QB')return p.pos==='QB';if(slot.startsWith('RB'))return p.pos==='RB';if(slot.startsWith('WR'))return p.pos==='WR';return slot===p.pos}
function initials(name){return String(name||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function avatar(p){if(p.pos==='DEF')return `<div class="avatar">${esc(p.team)}</div>`;return `<div class="avatar"><img src="https://sleepercdn.com/content/nfl/players/thumb/${encodeURIComponent(p.id)}.jpg" alt="" onerror="this.parentNode.textContent='${esc(initials(p.name))}'"></div>`}
function defensePlayers(){return Object.entries(TEAM_NAMES).map(([t,name])=>({id:'DEF-'+t,name,pos:'DEF',team:t,aliases:[name,t,name.split(' ').at(-1),name.split(' ').at(-1)+' defense',name.split(' ').at(-1)+' dst',t+' dst']}))}
function buildPlayerIndex(maps){const merged={};for(const data of maps)Object.assign(merged,data||{});const arr=[];for(const [id,p] of Object.entries(merged)){const pos=String(p.position||p.fantasy_positions?.[0]||'').toUpperCase();if(!['QB','RB','WR','TE','K'].includes(pos))continue;const name=p.full_name||[p.first_name,p.last_name].filter(Boolean).join(' ');if(!name)continue;arr.push({id:String(id),name,pos,team:canon(p.team||''),aliases:[name,p.search_full_name,[p.first_name,p.last_name].filter(Boolean).join(' ')].filter(Boolean)})}players=[...arr,...defensePlayers()];playerMap=new Map(players.map(p=>[p.id,p]));searchIndex=players.map(p=>({p,text:norm([p.name,p.team,p.pos,TEAM_NAMES[p.team]||''].join(' ')),aliases:[...new Set((p.aliases||[p.name]).map(norm).filter(Boolean))]}));$('#playerStatus').textContent=`Players: ${players.length.toLocaleString()} ready`;renderMatrix()}
async function loadPlayers(force=false){$('#playerStatus').textContent='Players: loading…';if(!force){try{const c=JSON.parse(localStorage.getItem(PLAYER_CACHE)||'null');if(c?.ts&&Date.now()-c.ts<86400000&&Array.isArray(c.maps)){buildPlayerIndex(c.maps);return}}catch(e){}}
  try{const positions=['QB','RB','WR','TE','K'];const maps=await Promise.all(positions.map(async pos=>{const r=await fetch(`https://api.sleeper.app/v1/players/nfl?position=${pos}&active=true`,{cache:'no-store'});if(!r.ok)throw new Error(`${pos} HTTP ${r.status}`);return r.json()}));localStorage.setItem(PLAYER_CACHE,JSON.stringify({ts:Date.now(),maps}));buildPlayerIndex(maps)}catch(e){$('#playerStatus').textContent='Players: load failed';toast('Player directory failed: '+e.message)}}
function searchPlayers(q){q=norm(q);if(q.length<2)return[];const toks=q.split(' ');return searchIndex.map(x=>{let s=0;if(x.text.startsWith(q))s+=80;if(x.text.includes(q))s+=45;for(const a of x.aliases){if(a===q)s+=140;else if(a.startsWith(q))s+=75;else if(a.includes(q))s+=35}s+=toks.filter(t=>x.text.includes(t)).length*8;return {p:x.p,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.p.name.localeCompare(b.p.name)).slice(0,18).map(x=>x.p)}
function renderSearch(){const q=$('#playerSearch').value,menu=$('#searchMenu');if(norm(q).length<2){menu.classList.remove('open');menu.innerHTML='';return}if(!players.length){menu.innerHTML='<div class="searchitem"><div><b>Player data is still loading</b><small>Use Reload Players if this does not clear.</small></div></div>';menu.classList.add('open');return}const hits=searchPlayers(q);menu.innerHTML=hits.length?hits.map(p=>`<div class="searchitem" data-player-id="${esc(p.id)}">${avatar(p)}<div><b>${esc(p.name)}</b><small>${esc(p.pos)} · ${esc(p.team||'FA')}</small></div></div>`).join(''):'<div class="searchitem"><div><b>No match</b><small>Try a shorter name.</small></div></div>';menu.classList.add('open')}
function openAssignment(p,leagueId=null,slotKey=null){if(!state.leagues.length){toast('Create a league first');newLeague();return}pendingPlayer=p;$('#assignHero').innerHTML=`${avatar(p)}<div><b>${esc(p.name)}</b><small>${esc(p.pos)} · ${esc(p.team||'FA')}</small></div>`;$('#assignLeague').innerHTML=state.leagues.map(l=>`<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('');$('#assignLeague').value=leagueId&&state.leagues.some(l=>l.id===leagueId)?leagueId:state.leagues[0].id;renderAssignSlots(slotKey);openModal('assignModal')}
function renderAssignSlots(preferred=null){const l=state.leagues.find(x=>x.id===$('#assignLeague').value),p=pendingPlayer;if(!l||!p)return;const opts=slotRows().filter(s=>compatible(p,s.key)).map(s=>({s,taken:!!l.roster[s.key]}));$('#assignSlot').innerHTML=opts.map(x=>`<option value="${x.s.key}" ${x.s.key===preferred?'selected':''}>${x.s.label}${x.taken?' — replace '+(playerMap.get(l.roster[x.s.key])?.name||'player'):''}</option>`).join('');if(preferred&&opts.some(x=>x.s.key===preferred))$('#assignSlot').value=preferred;else{const open=opts.find(x=>!x.taken);if(open)$('#assignSlot').value=open.s.key}}
function assignPending(){const l=state.leagues.find(x=>x.id===$('#assignLeague').value),slot=$('#assignSlot').value;if(!l||!pendingPlayer||!slot)return;const old=l.roster[slot];if(old&&!confirm(`Replace ${playerMap.get(old)?.name||'the current player'} in ${slot}?`))return;l.roster[slot]=pendingPlayer.id;saveState();closeModal('assignModal');$('#playerSearch').value='';$('#searchMenu').classList.remove('open');renderMatrix();toast(`${pendingPlayer.name} → ${l.name} ${slot}`)}
function stat(st,k){return num(st?.[k])}
function defensePA(st){for(const k of ['pts_allow','pts_allowed','pts_against'])if(st&&st[k]!==undefined)return num(st[k]);return null}
function calcPoints(p,st,s){st=st||{};if(p.pos==='DEF'){let t=stat(st,'sack')*s.defSack+stat(st,'int')*s.defInt+stat(st,'fum_rec')*s.defFR+stat(st,'def_td')*s.defTD+stat(st,'def_st_td')*s.defTD;const pa=defensePA(st);if(pa!==null)t+=pa===0?s.pa0:pa<=6?s.pa1_6:pa<=13?s.pa7_13:pa<=20?s.pa14_20:pa<=27?s.pa21_27:pa<=34?s.pa28_34:s.pa35;return t}let t=stat(st,'pass_yd')*s.passYd+stat(st,'pass_td')*s.passTD+stat(st,'pass_int')*s.passInt+stat(st,'rush_yd')*s.rushYd+stat(st,'rush_td')*s.rushTD+stat(st,'rec')*s.rec+stat(st,'rec_yd')*s.recYd+stat(st,'rec_td')*s.recTD+stat(st,'fum_lost')*s.fumLost;if(p.pos==='K'){const fgm=stat(st,'fgm'),f40=stat(st,'fgm_40_49'),f50=stat(st,'fgm_50p');t+=(Math.max(0,fgm-f40-f50))*s.fg0+f40*s.fg40+f50*s.fg50+stat(st,'xpm')*s.xpm}return t}
function playerStats(p){return p.pos==='DEF'?(statsByTeam.get(p.team)||statsByPlayer.get(p.team)||statsByPlayer.get(p.id)||{}):(statsByPlayer.get(p.id)||{})}
function statChips(p,st){const out=[],push=(v,label)=>{if(v!==0&&v!==null&&v!==undefined)out.push(`${v} ${label}`)};if(p.pos==='QB'){push(stat(st,'pass_yd'),'PYD');push(stat(st,'pass_td'),'PTD');push(stat(st,'pass_int'),'INT');push(stat(st,'rush_yd'),'RYD');push(stat(st,'rush_td'),'RTD')}else if(['RB','WR','TE'].includes(p.pos)){push(stat(st,'rush_yd'),'RYD');push(stat(st,'rush_td'),'RTD');push(stat(st,'rec'),'REC');push(stat(st,'rec_yd'),'REY');push(stat(st,'rec_td'),'RETD');push(stat(st,'fum_lost'),'FUM')}else if(p.pos==='K'){push(stat(st,'fgm'),'FG');push(stat(st,'xpm'),'XP')}else if(p.pos==='DEF'){push(stat(st,'sack'),'SACK');push(stat(st,'int'),'INT');push(stat(st,'fum_rec'),'FR');push(stat(st,'def_td'),'TD');const pa=defensePA(st);if(pa!==null)push(pa,'PA')}return out.slice(0,6)}
function gameFor(p){return gamesByTeam.get(p.team)||null}
function gameDisplay(g){if(!g)return {label:'No game',cls:'pre',progress:0,opp:''};return {label:g.label,cls:g.state,progress:g.progress,opp:g.opp||''}}
function playerCard(l,slot,p){const st=playerStats(p),pts=calcPoints(p,st,l.scoring),g=gameDisplay(gameFor(p));return `<div class="pcard"><div class="phead">${avatar(p)}<div class="pname"><b>${esc(p.name)}</b><small>${esc(p.pos)} · ${esc(p.team||'FA')}${g.opp?' vs '+esc(g.opp):''}</small></div><button class="remove" data-remove="${esc(l.id)}|${esc(slot)}" title="Remove">×</button></div><div class="gameLine"><span class="gameState ${g.cls}">${esc(g.label)}</span><div class="progress"><i style="width:${Math.max(0,Math.min(100,g.progress))}%"></i></div></div><div class="statLine">${statChips(p,st).map(x=>`<span class="stat">${esc(x)}</span>`).join('')||'<span class="stat">No stats yet</span>'}</div><div class="fantasyLine"><strong>${fmt(pts)}</strong><span>fantasy pts</span></div></div>`}
function leagueTotal(l){let t=0;for(const [slot] of STARTERS){const id=l.roster[slot],p=playerMap.get(id);if(p)t+=calcPoints(p,playerStats(p),l.scoring)}return t}
function renderMatrix(){const no=state.leagues.length===0;$('#emptyStart').style.display=no?'block':'none';$('#matrixShell').style.display=no?'none':'block';if(no)return;const rows=slotRows(),matrix=$('#matrix');matrix.innerHTML=`<thead><tr><th class="slotHead leagueHead">Slot</th>${state.leagues.map(l=>`<th class="leagueHead"><div class="leagueHeadTop"><div><h3>${esc(l.name)}</h3><small>${esc(l.platform||'')} ${l.note?'· '+esc(l.note):''}</small></div><div class="leaguePts"><b>${fmt(leagueTotal(l))}</b><span>starter pts</span></div></div><div class="leagueActions"><button class="btn small" data-edit-league="${esc(l.id)}">Edit</button><button class="btn small" data-score-league="${esc(l.id)}">Scoring</button></div></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.bench?'benchRow':''}"><td class="slotCell"><span class="slotTag ${r.bench?'bench':''}">${esc(r.label)}</span></td>${state.leagues.map(l=>{const id=l.roster[r.key],p=playerMap.get(id);return `<td class="playerCell ${p?'':'empty'}" data-cell="${esc(l.id)}|${esc(r.key)}">${p?playerCard(l,r.key,p):'<div class="emptyCell">+ Add '+esc(r.label)+'</div>'}</td>`}).join('')}</tr>`).join('')}</tbody>`;wireMatrix()}
function wireMatrix(){$$('[data-cell]').forEach(td=>td.onclick=e=>{if(e.target.closest('[data-remove]'))return;if(td.querySelector('.pcard'))return;const [lid,slot]=td.dataset.cell.split('|');presetTarget={lid,slot};$('#playerSearch').focus();toast(`Search a player for ${slot}`)});$$('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [lid,slot]=b.dataset.remove.split('|'),l=state.leagues.find(x=>x.id===lid);if(l){delete l.roster[slot];saveState();renderMatrix()}});$$('[data-edit-league]').forEach(b=>b.onclick=()=>editLeague(b.dataset.editLeague));$$('[data-score-league]').forEach(b=>b.onclick=()=>openScoring(b.dataset.scoreLeague))}
function syncSelectors(){const years=[];for(let y=new Date().getFullYear()+1;y>=new Date().getFullYear()-2;y--)years.push(`<option value="${y}" ${state.season===y?'selected':''}>${y}</option>`);$('#season').innerHTML=years.join('');$('#week').innerHTML=Array.from({length:18},(_,i)=>`<option value="${i+1}" ${state.week===i+1?'selected':''}>W${i+1}</option>`).join('');$('#benchCount').innerHTML=Array.from({length:8},(_,i)=>i+3).map(n=>`<option value="${n}" ${state.benchCount===n?'selected':''}>${n}</option>`).join('')}
function newLeague(){editingLeague=null;$('#leagueModalTitle').textContent='Add League';$('#leagueName').value='';$('#leaguePlatform').value='Yahoo';$('#leaguePreset').value='half';$('#leagueNote').value='';$('#deleteLeague').style.display='none';openModal('leagueModal')}
function editLeague(id){const l=state.leagues.find(x=>x.id===id);if(!l)return;editingLeague=id;$('#leagueModalTitle').textContent='Edit League';$('#leagueName').value=l.name;$('#leaguePlatform').value=l.platform||'Other';$('#leagueNote').value=l.note||'';$('#deleteLeague').style.display='inline-flex';openModal('leagueModal')}
function saveLeague(){const name=$('#leagueName').value.trim();if(!name){toast('Enter a league name');return}if(editingLeague){const l=state.leagues.find(x=>x.id===editingLeague);l.name=name;l.platform=$('#leaguePlatform').value;l.note=$('#leagueNote').value.trim()}else state.leagues.push({id:uid(),name,platform:$('#leaguePlatform').value,note:$('#leagueNote').value.trim(),scoring:defaultScore($('#leaguePreset').value),roster:{}});saveState();closeModal('leagueModal');renderMatrix();toast('League saved')}
function deleteLeague(){if(!editingLeague)return;const l=state.leagues.find(x=>x.id===editingLeague);if(l&&confirm(`Delete ${l.name}?`)){state.leagues=state.leagues.filter(x=>x.id!==editingLeague);saveState();closeModal('leagueModal');renderMatrix()}}
const SCORE_FIELDS=[['rec','Reception'],['passYd','Pass yard'],['passTD','Pass TD'],['passInt','Pass INT'],['rushYd','Rush yard'],['rushTD','Rush TD'],['recYd','Rec yard'],['recTD','Rec TD'],['fumLost','Fumble lost'],['xpm','Made XP'],['fg0','FG 0-39'],['fg40','FG 40-49'],['fg50','FG 50+'],['defSack','D/ST sack'],['defInt','D/ST INT'],['defFR','D/ST fumble rec'],['defTD','D/ST TD'],['pa0','PA 0'],['pa1_6','PA 1-6'],['pa7_13','PA 7-13'],['pa14_20','PA 14-20'],['pa21_27','PA 21-27'],['pa28_34','PA 28-34'],['pa35','PA 35+']];
function openScoring(id){const l=state.leagues.find(x=>x.id===id);if(!l)return;editingLeague=id;$('#scoringTitle').textContent=l.name+' Scoring';$('#scoreGrid').innerHTML=SCORE_FIELDS.map(([k,label])=>`<label>${label}<input class="field scoreInput" data-score="${k}" type="number" step="0.01" value="${num(l.scoring[k])}"></label>`).join('');openModal('scoringModal')}
function saveScoring(){const l=state.leagues.find(x=>x.id===editingLeague);if(!l)return;$$('.scoreInput').forEach(i=>l.scoring[i.dataset.score]=num(i.value));saveState();closeModal('scoringModal');renderMatrix();toast('Scoring saved')}
function mapStats(data){statsByPlayer.clear();statsByTeam.clear();for(const row of Array.isArray(data)?data:Object.entries(data||{}).map(([id,v])=>({player_id:id,...(v||{})}))){const st=row.stats&&typeof row.stats==='object'?row.stats:row,pid=row.player_id||row.id||row.player?.player_id;if(pid!==undefined&&pid!==null)statsByPlayer.set(String(pid),st);const t=canon(row.team||row.player?.team||st.team||'');if(t)statsByTeam.set(t,st)}}
function mapGames(data){gamesByTeam.clear();for(const ev of data?.events||[]){const comp=ev.competitions?.[0];if(!comp)continue;const status=comp.status||ev.status||{},type=status.type||{},period=num(status.period),clock=status.displayClock||'',completed=!!type.completed,state=type.state||'pre',short=type.shortDetail||type.detail||'';const teams=(comp.competitors||[]).map(c=>({abbr:canon(c.team?.abbreviation||''),score:c.score||'0'}));for(const t of teams){if(!t.abbr)continue;const opp=teams.find(x=>x.abbr!==t.abbr)?.abbr||'';let label='Pregame',cls='pre',progress=0;if(completed){label='FINAL';cls='final';progress=100}else if(state==='in'){cls='live';if(short)label=short;else label=period===2&&clock==='0:00'?'HALF':`Q${period} ${clock}`;const mins=String(clock).split(':');const remain=(num(mins[0])+(num(mins[1])/60));progress=period>=1?Math.min(99,Math.max(1,((period-1)*15+(15-remain))/60*100)):1}else{label=short||'Pregame'}gamesByTeam.set(t.abbr,{label,state:cls,progress,opp})}}}
async function fetchJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function refreshData(showToast=true){$('#dataStatus').textContent='Refreshing…';const season=state.season,week=state.week,key=`${season}-${week}`;try{const [stats,games]=await Promise.all([fetchJSON(`https://api.sleeper.com/stats/nfl/${season}/${week}?season_type=regular`).catch(()=>fetchJSON(`https://api.sleeper.app/stats/nfl/${season}/${week}?season_type=regular`)),fetchJSON(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${season}&seasontype=2&week=${week}&limit=100`)]);mapStats(stats);mapGames(games);localStorage.setItem(WEEK_CACHE,JSON.stringify({key,ts:Date.now(),stats,games}));$('#dataStatus').textContent=`Week ${week} updated ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`;renderMatrix();if(showToast)toast('Weekend data refreshed')}catch(e){let used=false;try{const c=JSON.parse(localStorage.getItem(WEEK_CACHE)||'null');if(c?.key===key){mapStats(c.stats);mapGames(c.games);used=true;renderMatrix()}}catch(_){}$('#dataStatus').textContent=used?'Live refresh failed · cached data shown':'Data unavailable';if(showToast)toast('Refresh failed: '+e.message)}}
function bind(){$('#addLeague').onclick=newLeague;$('#emptyAddLeague').onclick=newLeague;$('#saveLeague').onclick=saveLeague;$('#deleteLeague').onclick=deleteLeague;$('#saveAssignment').onclick=assignPending;$('#saveScoring').onclick=saveScoring;$('#playerSearch').oninput=renderSearch;$('#searchMenu').onclick=e=>{const hit=e.target.closest('[data-player-id]');if(!hit)return;const p=playerMap.get(hit.dataset.playerId);if(!p)return;$('#searchMenu').classList.remove('open');openAssignment(p,presetTarget?.lid||null,presetTarget?.slot||null);presetTarget=null};document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap'))$('#searchMenu').classList.remove('open')});$('#assignLeague').onchange=()=>renderAssignSlots();$('#refresh').onclick=()=>refreshData(true);$('#reloadPlayers').onclick=()=>loadPlayers(true);$('#season').onchange=e=>{state.season=num(e.target.value);saveState();refreshData(true)};$('#week').onchange=e=>{state.week=num(e.target.value);saveState();refreshData(true)};$('#benchCount').onchange=e=>{state.benchCount=num(e.target.value);saveState();renderMatrix()};$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));$$('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}))}
async function init(){bind();syncSelectors();renderMatrix();try{const c=JSON.parse(localStorage.getItem(WEEK_CACHE)||'null'),key=`${state.season}-${state.week}`;if(c?.key===key){mapStats(c.stats);mapGames(c.games);$('#dataStatus').textContent='Cached week data loaded';renderMatrix()}}catch(e){}await loadPlayers(false);refreshData(false);refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')refreshData(false)},60000)}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
